services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5017:5017"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/learning-agents.db
      - Gemini__ApiKey=${GEMINI_API_KEY:-}
      - Groq__ApiKey=${GROQ_API_KEY:-}
      - OpenRouter__ApiKey=${OPENROUTER_API_KEY:-}
      - Cors__AllowedOrigins__0=http://localhost:4200
      - Cors__AllowedOrigins__1=http://localhost
    volumes:
      - api-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5017/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  api-data:
