<div class="min-h-dvh bg-canvas text-text-primary lg:flex">
  @if (appState.mobileSidebarOpen()) {
    <div
      class="fixed inset-0 z-40 bg-black/55 lg:hidden"
      aria-hidden="true"
      (click)="appState.closeMobileSidebar()"
    ></div>
  }

  <div
    class="fixed inset-y-0 left-0 z-50 h-dvh w-80 max-w-[86vw] shrink-0 transition-transform duration-200 ease-out lg:static lg:z-auto lg:h-screen lg:w-80 lg:max-w-none"
    [class.max-lg:-translate-x-full]="!appState.mobileSidebarOpen()"
  >
    <app-sidebar
      [showCloseButton]="appState.mobileSidebarOpen()"
      (closeRequested)="appState.closeMobileSidebar()"
      (sessionSelected)="appState.closeMobileSidebar()"
    />
  </div>

  <div class="flex min-h-dvh min-w-0 flex-1 flex-col lg:h-screen lg:min-h-0">
    <div class="min-h-0 flex-1">
      <app-chat />
    </div>
  </div>

  @if (appState.drawerOpen()) {
    <div
      class="fixed inset-0 z-40 bg-black/55 xl:hidden"
      aria-hidden="true"
      (click)="appState.closeDrawer()"
    ></div>
    <div class="fixed inset-y-0 right-0 z-50 h-dvh w-full max-w-md shrink-0 shadow-2xl xl:static xl:z-auto xl:h-screen xl:w-[25rem] xl:max-w-none xl:shadow-none">
      <app-drawer [showCloseButton]="true" (closeRequested)="appState.closeDrawer()" />
    </div>
  }
</div>
